<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая галерея</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .gallery {
            max-width: 900px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            transition: opacity 0.3s;
        }

        .thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .thumbnails img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.3s;
            border: 3px solid transparent;
        }

        .thumbnails img:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .thumbnails img.active {
            opacity: 1;
            border-color: #3498db;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .counter {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <img id="mainImage" class="main-image" src="" alt="Главное изображение">
        
        <div class="controls">
            <button class="btn" id="prevBtn">← Назад</button>
            <span class="counter" id="counter"></span>
            <button class="btn" id="nextBtn">Вперёд →</button>
        </div>

        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <script>
        // Массив с изображениями (можно заменить на свои)
        const images = [
            'https://picsum.photos/id/1015/900/500',
            'https://picsum.photos/id/1016/900/500',
            'https://picsum.photos/id/1018/900/500',
            'https://picsum.photos/id/1019/900/500',
            'https://picsum.photos/id/1021/900/500',
            'https://picsum.photos/id/1024/900/500'
        ];

        let currentIndex = 0;

        const mainImage = document.getElementById('mainImage');
        const thumbnailsContainer = document.getElementById('thumbnails');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');

        // Создание миниатюр
        function createThumbnails() {
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Миниатюра ${index + 1}`;
                img.addEventListener('click', () => showImage(index));
                thumbnailsContainer.appendChild(img);
            });
        }

        // Показать изображение по индексу
        function showImage(index) {
            currentIndex = index;
            mainImage.style.opacity = 0;

            setTimeout(() => {
                mainImage.src = images[currentIndex];
                mainImage.style.opacity = 1;
            }, 150);

            // Обновить активную миниатюру
            const thumbs = thumbnailsContainer.querySelectorAll('img');
            thumbs.forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentIndex);
            });

            // Обновить счётчик
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        // Навигация
        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        }

        // Обработчики событий
        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);

        // Навигация клавишами
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Инициализация
        createThumbnails();
        showImage(0);
    </script>
</body>
</html>к
